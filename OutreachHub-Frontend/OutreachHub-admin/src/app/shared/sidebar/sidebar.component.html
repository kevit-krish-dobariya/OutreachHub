<!-- 
  ADMIN SIDEBAR COMPONENT
  - Fully responsive and collapsible.
  - Supports both light and dark modes.
-->
<div class="flex h-screen antialiased">
  <aside
    class="z-20 flex h-full flex-col shadow-xl transition-all duration-500 ease-in-out bg-white dark:bg-gradient-to-b dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-slate-700 dark:text-slate-200"
    [class.w-64]="!collapsed"
    [class.w-20]="collapsed">

    <!-- Section 1: Header -->
    <div class="flex h-18 items-center justify-between border-b border-gray-200 dark:border-slate-700/70 p-4">
      <h1 *ngIf="!collapsed"
        class="text-2xl font-extrabold bg-gradient-to-r from-sky-500 to-indigo-500 bg-clip-text text-transparent tracking-wide animate-fade-in"
        [class.opacity-0]="collapsed">
        OutreachHub
      </h1>
      <button (click)="toggleSidebar()"
        class="rounded-lg p-2 text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700/60 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor" class="h-6 w-6 transform transition-transform duration-500 group-hover:rotate-180">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>

    <!-- Section 2: Main Navigation -->
    <nav class="flex-1 space-y-2 px-3 py-4">
      <!-- Standard Nav Links -->
      <a *ngFor="let link of navLinks" [routerLink]="link.path"
        routerLinkActive="bg-indigo-100 text-indigo-600 dark:bg-sky-500/20 dark:text-sky-400"
        class="group flex items-center gap-x-4 rounded-lg px-4 py-3 text-gray-600 dark:text-slate-300 transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-700/70 hover:text-gray-900 dark:hover:text-white hover:scale-[1.02]">
        <span [innerHTML]="link.icon " class="transition-colors duration-300 group-hover:text-sky-400"></span>
        <span class="font-medium tracking-wide transition-all duration-500"
          [class.opacity-0]="collapsed" [class.max-w-0]="collapsed" [class.scale-0]="collapsed">
          {{ link.label }}
        </span>
      </a>

      <!-- Workspaces Expandable Menu -->
      <div>
        <button (click)="toggleWorkspaces()"
          class="group flex w-full items-center justify-between rounded-lg px-4 py-3 text-gray-600 dark:text-slate-300 transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-700/70 hover:text-gray-900 dark:hover:text-white hover:scale-[1.02]">
          <div class="flex items-center gap-x-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 dark:text-slate-400 group-hover:text-sky-400 transition-colors"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5l9-4.5 9 4.5-9 4.5-9-4.5zm0 6l9 4.5 9-4.5" />
            </svg>
            <span class="font-medium tracking-wide transition-all duration-500"
              [class.opacity-0]="collapsed" [class.max-w-0]="collapsed" [class.scale-0]="collapsed">
              Workspaces
            </span>
          </div>
          <svg *ngIf="!collapsed" xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-gray-400 dark:text-slate-400 transition-transform duration-300"
            [class.rotate-90]="workspacesExpanded" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <div class="ml-12 mt-2 space-y-2 text-sm text-gray-500 dark:text-slate-400 overflow-hidden transition-all duration-500"
          [class.max-h-40]="workspacesExpanded" [class.max-h-0]="!workspacesExpanded">
          <a routerLink="/workspace/workspace-list" class="block rounded-md px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-700/60 hover:text-gray-900 dark:hover:text-white transition">
            My Workspaces
          </a>
          <a routerLink="/workspace/add-workspace" class="block rounded-md px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-700/60 hover:text-gray-900 dark:hover:text-white transition">
            Add New Workspace
          </a>
        </div>
      </div>

      <!-- Manage Users Expandable Menu -->
      <div>
        <button (click)="toggleManageUsers()"
          class="group flex w-full items-center justify-between rounded-lg px-4 py-3 text-gray-600 dark:text-slate-300 transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-700/70 hover:text-gray-900 dark:hover:text-white hover:scale-[1.02]">
          <div class="flex items-center gap-x-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 dark:text-slate-400 group-hover:text-sky-400 transition-colors"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span class="font-medium tracking-wide transition-all duration-500"
              [class.opacity-0]="collapsed" [class.max-w-0]="collapsed" [class.scale-0]="collapsed">
              Manage Users
            </span>
          </div>
          <svg *ngIf="!collapsed" xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-gray-400 dark:text-slate-400 transition-transform duration-300"
            [class.rotate-90]="manageUsersExpanded" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <div class="ml-12 mt-2 space-y-2 text-sm text-gray-500 dark:text-slate-400 overflow-hidden transition-all duration-500"
          [class.max-h-40]="manageUsersExpanded" [class.max-h-0]="!manageUsersExpanded">
          <a routerLink="/workspaceusers/users" class="block rounded-md px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-700/60 hover:text-gray-900 dark:hover:text-white transition">
            View Workspace Users
          </a>
          <a routerLink="/workspaceusers/new-users" class="block rounded-md px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-700/60 hover:text-gray-900 dark:hover:text-white transition">
            Manage New Users
          </a>
        </div>
      </div>
    </nav>

    <!-- Section 3: Footer (Theme Toggle & Logout) -->
    <div class="mt-auto">
      <!-- Theme Toggle -->
      <div class="border-t border-gray-200 dark:border-slate-700/70 p-3">
        <button (click)="toggleTheme()"
          class="group flex w-full items-center justify-between rounded-lg p-3 bg-gray-50 dark:bg-slate-800/40 backdrop-blur-sm transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-700/70">
          <span class="font-semibold text-gray-700 dark:text-white transition-all duration-500"
            [class.opacity-0]="collapsed" [class.max-w-0]="collapsed">
            <span *ngIf="!isDarkMode">Dark Mode</span>
            <span *ngIf="isDarkMode">Light Mode</span>
          </span>
          <div class="relative flex h-6 w-11 items-center justify-between rounded-full bg-gray-300 dark:bg-slate-600/50 p-1 transition-colors duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-yellow-400" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM5.166 17.834a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.166 6.106a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.061-1.06l-1.59-1.591z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-black-300" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <div class="absolute h-5 w-5 top-[2px] left-[2px] rounded-full bg-white shadow-md transition-transform duration-300"
              [ngClass]="{ 'translate-x-5': isDarkMode, 'translate-x-0': !isDarkMode }">
            </div>
          </div>
        </button>
      </div>

      <!-- Logout Button -->
      <div class="border-t border-gray-200 dark:border-slate-700/70 p-3">
        <button (click)="handleLogout()"
          class="group flex w-full items-center gap-x-4 rounded-lg px-4 py-3 text-gray-600 dark:text-slate-300 transition-all duration-300 hover:bg-red-50 dark:hover:bg-red-600/90 hover:text-red-600 dark:hover:text-white hover:scale-[1.02]">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="h-6 w-6 transition-colors group-hover:text-red-600 dark:group-hover:text-white">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12" />
          </svg>
          <span class="font-semibold transition-all duration-300" [class.opacity-0]="collapsed">
            Logout
          </span>
        </button>
      </div>
    </div>
  </aside>
</div>
