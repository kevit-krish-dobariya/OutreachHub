<!-- 
  UPDATE WORKSPACE COMPONENT
  - Provides a form for updating an existing workspace.
  - Features a consistent header with a back button.
  - Fully supports both light and dark modes.
-->

<!-- Main Page Container -->
<div class="flex h-screen w-full flex-col bg-gray-100 dark:bg-gradient-to-br dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-gray-800 dark:text-slate-300">

  <!-- Header Section -->
  <header class="flex items-center justify-between border-b border-gray-200 dark:border-slate-700/50 bg-white dark:bg-slate-900/50 px-8 py-4 shadow-sm dark:shadow-lg dark:backdrop-blur-md">
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-wide">Update Workspace</h1>
    <button (click)="goBack()"
      class="rounded-lg bg-gray-200 dark:bg-slate-700 px-4 py-2 text-sm font-semibold text-gray-800 dark:text-white hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">
      ← Back to List
    </button>
  </header>

  <!-- Main Content: Update Form -->
  <main class="flex-1 flex justify-center items-start p-8">
    <form [formGroup]="workspaceForm" (ngSubmit)="onSubmit()" class="w-full max-w-lg bg-white dark:bg-slate-800/60 rounded-xl shadow-xl p-8 space-y-6 ring-1 ring-gray-200/50 dark:ring-slate-700/50">
      
      <!-- Workspace Name Input -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-white">Workspace Name</label>
        <input
          type="text"
          formControlName="name"
          class="w-full rounded-lg bg-gray-50 dark:bg-slate-900/80 border border-gray-300 dark:border-slate-700 px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-yellow-500"
          placeholder="Enter workspace name"
        />
        <div *ngIf="f['name'].touched && f['name'].invalid" class="text-red-500 text-xs mt-1">
          Name is required.
        </div>
      </div>

      <!-- Description Input -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-white">Description</label>
        <textarea
          formControlName="description"
          rows="3"
          class="w-full rounded-lg bg-gray-50 dark:bg-slate-900/80 border border-gray-300 dark:border-slate-700 px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-yellow-500"
          placeholder="Enter workspace description"
        ></textarea>
        <div *ngIf="f['description'].touched && f['description'].invalid" class="text-red-500 text-xs mt-1">
          Description is required.
        </div>
      </div>

      <!-- Feedback Messages -->
      <div *ngIf="errorMsg" class="text-red-500 dark:text-red-400 text-sm">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="text-green-600 dark:text-green-400 text-sm">{{ successMsg }}</div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-x-4 pt-4 border-t border-gray-200 dark:border-slate-700/50">
        <button
          type="button"
          class="rounded-lg bg-gray-200 dark:bg-slate-700 px-5 py-2.5 text-sm font-semibold text-gray-800 dark:text-white hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors"
          (click)="goBack()">
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-lg bg-blue-600 hover:bg-blue-700 dark:bg-yellow-400 dark:hover:bg-yellow-500 dark:text-indigo-900 px-5 py-2.5 text-sm font-semibold text-white shadow-md transition-all duration-200 disabled:opacity-50"
          [disabled]="workspaceForm.invalid || isLoading">
          {{ isLoading ? 'Updating...' : 'Update Workspace' }}
        </button>
      </div>

    </form>
  </main>
</div>
