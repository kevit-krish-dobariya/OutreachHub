<!-- Main Page Container -->
<div class="flex h-full w-full flex-col bg-gray-100 dark:bg-gradient-to-br dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-gray-800 dark:text-slate-300">

  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-200 dark:border-slate-700/50 bg-white dark:bg-slate-900/50 px-8 py-4 shadow-lg backdrop-blur-md">
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-wide">Assign Users to Workspaces 🧑‍💼</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-slate-400">Manage users who are not yet part of any workspace.</p>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-8">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex h-full items-center justify-center">
      <div class="text-center">
        <svg class="mx-auto h-12 w-12 animate-spin text-blue-600 dark:text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-4 text-lg font-semibold text-gray-700 dark:text-slate-300">Loading Data...</p>
      </div>
    </div>

    <!-- Content after loading -->
    <div *ngIf="!isLoading">
      <!-- Unassigned Users Table (shown if users exist) -->
      <div *ngIf="unassignedUsers.length > 0; else noUnassignedUsersTemplate" class="overflow-hidden rounded-xl bg-white dark:bg-slate-800/50 shadow-2xl ring-1 ring-gray-200/50 dark:ring-slate-700/50">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-gray-50 dark:bg-slate-900/70 text-xs uppercase tracking-wider text-gray-600 dark:text-yellow-300">
            <tr>
              <th class="px-6 py-4">Username</th>
              <th class="px-6 py-4">Email</th>
              <th class="px-6 py-4">Assign to Workspace</th>
              <th class="px-6 py-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-slate-700/50">
            <tr *ngFor="let user of unassignedUsers" class="hover:bg-gray-50 dark:hover:bg-slate-800/70 transition-colors duration-200">
              <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">{{ user.username }}</td>
              <td class="px-6 py-4 text-gray-500 dark:text-slate-400">{{ user.email }}</td>
              <td class="px-6 py-4">
                <select [(ngModel)]="user.selectedWorkspaceId" class="w-full rounded-md border-0 bg-gray-100 dark:bg-slate-700/80 px-3 py-1.5 text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-slate-600 focus:ring-2 focus:ring-indigo-500 dark:focus:ring-yellow-400">
                  <option [ngValue]="undefined" disabled>Select a workspace</option>
                  <option *ngFor="let ws of allWorkspaces" [value]="ws._id">{{ ws.name }}</option>
                </select>
              </td>
              <td class="px-6 py-4 text-center">
                <button (click)="onAssignUser(user)" [disabled]="!user.selectedWorkspaceId" class="rounded-md bg-indigo-600 dark:bg-yellow-400 px-4 py-2 text-xs font-semibold text-white dark:text-indigo-900 shadow-sm transition-colors hover:bg-indigo-500 dark:hover:bg-yellow-500 disabled:cursor-not-allowed disabled:opacity-50">
                  Assign
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- No Unassigned Users Template -->
      <ng-template #noUnassignedUsersTemplate>
        <div class="flex flex-col items-center justify-center rounded-lg border-2 border-dashed border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800/30 p-12 text-center">
          <h3 class="text-xl font-semibold text-gray-900 dark:text-white">All Users Assigned! ✅</h3>
          <p class="mt-2 text-gray-500 dark:text-slate-400">There are currently no users waiting to be assigned to a workspace.</p>
        </div>
      </ng-template>
    </div>
  </main>
</div>
