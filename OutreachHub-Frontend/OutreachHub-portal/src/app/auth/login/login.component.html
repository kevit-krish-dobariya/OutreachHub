<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white rounded-2xl shadow-xl flex overflow-hidden max-w-4xl w-full">

    <!-- Left: Illustration -->
    <div class="hidden md:flex w-1/2 items-center justify-center bg-blue-50">
      <img src="assets/vector2.png" alt="Login Illustration" class="object-contain max-h-[80%]" />
    </div>

    <!-- Right: Login Form -->
    <div class="w-full md:w-1/2 p-10">
      <!-- Logo & Title -->
      <div class="flex justify-center items-center my-4">
        <img src="assets/symbol.png" alt="OutreachHub Logo" class="h-14 w-14 mr-2">
        <h1 class="text-3xl font-bold text-blue-600">OutreachHub</h1>
      </div>
      <p class="text-gray-500 mb-6 text-center">Welcome back! Please log in to continue.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Username -->
        <div>
          <input formControlName="username" type="text" placeholder="Username"
            class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" />
          <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-red-500 text-sm mt-1">
            Valid username is required.
          </div>
        </div>

        <!-- Password -->
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
            class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" />
          <!-- Eye Icon -->
          <button type="button" (click)="togglePassword()"
            class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-blue-600">
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-sm mt-1">
            Password is required.
          </div>
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center">
            <input type="checkbox" class="text-blue-500 focus:ring-blue-400 rounded" />
            <span class="ml-2 text-gray-600">Remember me</span>
          </label>
          <a routerLink="/forgot-password" class="text-blue-500 hover:underline">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition">
          LOG IN
        </button>
      </form>

      <!-- Footer link -->
      <p class="text-sm text-gray-500 mt-6 text-center">
        Don’t have an account?
        <a routerLink="auth/signup" class="text-blue-600 font-medium hover:underline">Sign up</a>
      </p>
    </div>
  </div>
</div>
