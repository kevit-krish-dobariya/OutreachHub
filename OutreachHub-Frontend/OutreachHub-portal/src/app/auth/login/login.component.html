<!-- Main Page Container -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-950">
  <!-- MODIFIED: Increased max-w-4xl to max-w-5xl to make the box larger -->
  <div class="bg-white dark:bg-slate-800/50 rounded-2xl shadow-xl flex overflow-hidden max-w-5xl w-full ring-1 ring-gray-200/50 dark:ring-slate-700/50">

    <!-- Left: Illustration -->
    <div class="hidden md:flex w-1/2 items-center justify-center bg-white dark:bg-slate-900/50 p-6">
      <img src="assets/vector2.png" alt="Login Illustration" class="object-contain max-h-[80%]" />
    </div>

    <!-- Right: Login Form -->
    <div class="w-full md:w-1/2 p-10">
      <!-- Logo & Title -->
      <div class="flex justify-center items-center my-4">
        <img src="assets/logo.png" alt="OutreachHub Logo" class="h-14 w-14">
        <h1 class="text-3xl font-bold text-blue-600 dark:text-yellow-300">OutreachHub</h1>
      </div>
      <p class="text-gray-500 dark:text-gray-400 mb-6 text-center">Welcome back! Please log in to continue.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Username -->
        <div>
          <input formControlName="username" type="text" placeholder="Username"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-red-500 text-sm mt-1">
            Valid username is required.
          </div>
        </div>

        <!-- Password -->
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <!-- Eye Icon -->
          <button type="button" (click)="togglePassword()"
            class="absolute inset-y-0 right-3 flex items-center text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-yellow-400">
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-sm mt-1">
            Password is required.
          </div>
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center">
            <input type="checkbox" class="text-blue-500 dark:text-yellow-400 focus:ring-blue-400 dark:focus:ring-yellow-400 rounded bg-gray-100 dark:bg-slate-600 border-gray-300 dark:border-slate-500" />
            <span class="ml-2 text-gray-600 dark:text-gray-300">Remember me</span>
          </label>
          <a routerLink="/forgot-password" class="text-blue-500 dark:text-yellow-400 hover:underline">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-blue-600 dark:bg-yellow-400 text-white dark:text-indigo-900 font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 dark:hover:bg-yellow-500 transition">
          LOG IN
        </button>
      </form>

      <!-- Footer link -->
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-6 text-center">
        Don’t have an account?
        <a routerLink="auth/signup" class="text-blue-600 dark:text-yellow-400 font-medium hover:underline">Sign up</a>
      </p>
    </div>
  </div>
</div>





<!-- Theme Toggle Button -->
<button (click)="toggleTheme()"
        class="fixed bottom-8 right-8 z-50 w-14 h-14 rounded-full bg-white dark:bg-gray-800 text-gray-800 dark:text-yellow-400 shadow-lg flex items-center justify-center
               ring-1 ring-gray-300 dark:ring-gray-600 transition-transform hover:scale-110">

    <path fill-rule="evenodd" d="M12 2.25c.414 0 .75.336.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM5.166 17.834a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.166 6.106a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.061-1.06l-1.59-1.591z" clip-rule="evenodd" />
</svg>

<!-- Moon Icon for Dark Mode -->
<!-- MODIFIED: Replaced with a solid crescent moon icon for better visibility -->
<svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 21.8a9.796 9.796 0 0 1-1.245-19.513l1.286-.163-.843.984a8.285 8.285 0 0 0 8.519 13.383l1.252-.347-.696 1.096A9.755 9.755 0 0 1 12 21.8zM9.647 3.526a8.796 8.796 0 1 0 9.031 14.196 9.048 9.048 0 0 1-1.178.078A9.293 9.293 0 0 1 9.647 3.526z"></path>
</svg>



</button>
