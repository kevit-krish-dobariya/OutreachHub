<!-- Main Page Container -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-950">
  <!-- MODIFIED: Increased max-w-4xl to max-w-5xl to make the box larger -->
  <div class="bg-white dark:bg-slate-800/50 rounded-2xl shadow-xl flex overflow-hidden max-w-5xl w-full ring-1 ring-gray-200/50 dark:ring-slate-700/50">

    <!-- Left: Illustration -->
    <div class="hidden md:flex w-1/2 items-center justify-center bg-blue-50 dark:bg-slate-900/50 p-6">
      <img src="assets/vector.png" alt="Signup Illustration" class="object-contain max-h-[80%]" />
    </div>

    <!-- Right: Signup Form -->
    <div class="w-full md:w-1/2 p-10">
      <!-- Logo -->
      <div class="flex justify-center items-center my-4">
        <img src="assets/logo.png" alt="OutreachHub Logo" class="h-12 w-12">
        <h1 class="text-3xl font-bold text-blue-600 dark:text-yellow-300">OutreachHub</h1>
      </div>

      <p class="text-gray-500 dark:text-gray-400 mb-6 text-center">Get started with a free account.</p>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Username -->
        <div>
          <input formControlName="username" type="text" placeholder="Username"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <div *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched"
               class="text-red-500 text-sm mt-1">
            Username is required.
          </div>
        </div>

        <!-- Email -->
        <div>
          <input formControlName="email" type="email" placeholder="Email"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
               class="text-red-500 text-sm mt-1">
            Please enter a valid email.
          </div>
        </div>

        <!-- Phone -->
        <div>
          <input formControlName="phoneNumber" type="text" placeholder="Phone Number"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <div *ngIf="signupForm.get('phoneNumber')?.invalid && signupForm.get('phoneNumber')?.touched"
               class="text-red-500 text-sm mt-1">
            Please enter a valid 10-digit phone number.
          </div>
        </div>

        <!-- Password -->
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <button type="button" (click)="togglePassword()" class="absolute right-3 top-2.5 text-gray-500 dark:text-gray-400">
            <i [ngClass]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
          <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
               class="text-red-500 text-sm mt-1">
            Password must be at least 6 characters.
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Confirm Password"
            class="w-full px-4 py-2 border rounded-lg shadow-sm bg-gray-50 dark:bg-slate-700 border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-400 dark:focus:ring-yellow-400 focus:outline-none" />
          <button type="button" (click)="toggleConfirmPassword()" class="absolute right-3 top-2.5 text-gray-500 dark:text-gray-400">
            <i [ngClass]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
          <div *ngIf="signupForm.hasError('mismatch') && signupForm.get('confirmPassword')?.touched"
               class="text-red-500 text-sm mt-1">
            Passwords must match.
          </div>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-blue-600 dark:bg-yellow-400 text-white dark:text-indigo-900 font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 dark:hover:bg-yellow-500 transition">
          SIGN UP
        </button>
      </form>

      <!-- Footer -->
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-6 text-center">
        Already have an account?
        <a routerLink="/auth/login" class="text-blue-600 dark:text-yellow-400 font-medium hover:underline">Log in</a>
      </p>
    </div>
  </div>
</div>

<!-- Theme Toggle Button -->
<button (click)="toggleTheme()"
        class="fixed bottom-8 right-8 z-50 w-14 h-14 rounded-full bg-white dark:bg-gray-800 text-gray-800 dark:text-yellow-400 shadow-lg flex items-center justify-center
               ring-1 ring-gray-300 dark:ring-gray-600 transition-transform hover:scale-110">

</svg>

<!-- Moon Icon for Dark Mode -->
<!-- MODIFIED: Replaced with a solid crescent moon icon for better visibility -->
<svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 21.8a9.796 9.796 0 0 1-1.245-19.513l1.286-.163-.843.984a8.285 8.285 0 0 0 8.519 13.383l1.252-.347-.696 1.096A9.755 9.755 0 0 1 12 21.8zM9.647 3.526a8.796 8.796 0 1 0 9.031 14.196 9.048 9.048 0 0 1-1.178.078A9.293 9.293 0 0 1 9.647 3.526z"></path>
</svg>



</button>
