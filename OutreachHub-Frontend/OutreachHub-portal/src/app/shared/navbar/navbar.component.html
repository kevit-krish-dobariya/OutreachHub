<!-- Modern Navbar -->
<nav class="bg-gradient-to-r from-indigo-700 via-purple-600 to-pink-500 shadow-lg fixed top-0 left-0 w-full top-0 z-50">
  <div class=" px-6 py-4 flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center space-x-3 text-white font-bold text-2xl">
      <img src="https://flowbite.com/docs/images/logo.svg" class="h-10" alt="Logo" />
      <span>OutreachHub</span>
    </a>

    <!-- Center Nav Links (hidden on mobile) -->
    <div class="hidden md:flex flex-grow justify-center">
      <ul class="flex space-x-10 text-white font-medium text-lg">
        <li><a routerLink="/dashboard" class="hover:text-yellow-300 transition">Home</a></li>
        <li><a routerLink="/dashboard/contacts" class="hover:text-yellow-300 transition">Contacts</a></li>
        <li><a routerLink="/dashboard/templates" class="hover:text-yellow-300 transition">Message Templates</a></li>
        <li><a routerLink="/dashboard/campaigns" class="hover:text-yellow-300 transition">Campaigns</a></li>
        <li><a routerLink="/dashboard/about" class="hover:text-yellow-300 transition">About</a></li>
      </ul>
    </div>

    <!-- Right Profile + Logout (hidden on mobile) -->
    <div class="hidden md:flex items-center space-x-6">

      <!-- Profile Dropdown -->
      <div class="relative" (click)="toggleDropdown()">
        <button class="flex items-center bg-white rounded-full focus:ring-2 focus:ring-yellow-300 p-1">
          <img class="w-10 h-10 rounded-full" src="../../../assets/profile.jpg" alt="user photo" />
          <span class="ml-2 text-black font-medium">{{ username }}</span>
          <svg class="w-4 h-4 ml-1 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div *ngIf="dropdownOpen"
             class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 text-sm text-gray-700">
          <a routerLink="/dashboard" class="block px-4 py-2 hover:bg-gray-100 transition">Dashboard</a>
          <a routerLink="/settings" class="block px-4 py-2 hover:bg-gray-100 transition">Settings</a>
          <a routerLink="/profile" class="block px-4 py-2 hover:bg-gray-100 transition">Profile</a>
        </div>
      </div>

      <!-- Logout -->
      <button (click)="logout()" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg shadow-lg font-semibold transition">
        Logout
      </button>
    </div>

    <!-- Mobile Hamburger -->
    <button class="md:hidden text-white focus:outline-none" (click)="toggleMobileMenu()">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-gradient-to-b from-indigo-700 via-purple-600 to-pink-500 px-6 pb-6">
    <ul class="flex flex-col space-y-4 text-white font-medium text-lg">
      <li><a routerLink="/dashboard" class="hover:text-yellow-300 transition">Home</a></li>
      <li><a routerLink="/dashboard/contacts" class="hover:text-yellow-300 transition">Contacts</a></li>
      <li><a routerLink="/dashboard/templates" class="hover:text-yellow-300 transition">Message Templates</a></li>
      <li><a routerLink="/dashboard/campaigns" class="hover:text-yellow-300 transition">Campaigns</a></li>
      <li><a routerLink="/dashboard/about" class="hover:text-yellow-300 transition">About</a></li>
      <li><a routerLink="/settings" class="hover:text-yellow-300 transition">Settings</a></li>
      <li>
        <button (click)="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow font-semibold transition text-left">
          Logout
        </button>
      </li>
    </ul>
  </div>
</nav>
